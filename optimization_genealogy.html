const NODE_R = {core:16, pillar:12, pioneer:8, emerging:15};
const COLOR_MAP = {core:'#2563eb', pillar:'#f59e0b', pioneer:'#94a3b8', emerging:'#059669'};
const TIER_LABEL = {core:'核心学者', pillar:'重要节点', pioneer:'谱系支点', emerging:'新兴力量'};
const EDGE_LABEL = {phd:'博士师承', postdoc:'博士后指导', mentor:'阶段指导', collab:'合作（非师承）', influence:'学术影响（非师承）'};
const EDGE_STYLE = {
  phd:{color:'#94a3b8',width:1.8,type:'solid',opacity:.78},
  postdoc:{color:'#f59e0b',width:1.25,type:'dashed',opacity:.85},
  mentor:{color:'#8b5cf6',width:1.2,type:'dashed',opacity:.78},
  collab:{color:'#cbd5e1',width:1,type:'dotted',opacity:.7},
  influence:{color:'#cbd5e1',width:1,type:'dotted',opacity:.58}
};
const chart = echarts.init(document.getElementById('chart'));

const nodeIdx = {};
DATA.nodes.forEach((n,i)=>nodeIdx[n.id]=i);
const nodeById = id => DATA.nodes.find(n=>n.id===id);
const escapeHtml = value => String(value==null?'':value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
const isHttp = value => /^https?:\/\//i.test(String(value||''));

const nodes = DATA.nodes.map(n => ({
  ...n,
  symbolSize: NODE_R[n.tier]||6,
  itemStyle: {color: COLOR_MAP[n.tier]||'#cbd5e1', borderColor:'#fff', borderWidth:1.5, shadowBlur: ['core','emerging'].includes(n.tier)?8:3, shadowColor:'rgba(0,0,0,0.12)'},
  label: {show:true, fontSize: n.tier==='core'?13:n.tier==='emerging'?12:n.tier==='pillar'?11:10, color:'#4b5563', position:'top', distance:6},
  labelLayout: {hideOverlap:true, moveOverlap:'shiftY'},
  category: n.tier
}));

const edges = DATA.edges.map(e => {
  const style = EDGE_STYLE[e.type]||EDGE_STYLE.influence;
  return {
    source: e.from, target: e.to,
    relationType:e.type, relationLabel:e.label||'', relationSource:e.source||'',
    lineStyle: {...style},
    label: {show:false}
  };
});

    const a=nodeById(p.data.source), b=nodeById(p.data.target);
    return `<b>${escapeHtml((a&&a.name)||p.data.source)} → ${escapeHtml((b&&b.name)||p.data.target)}</b><br/>${escapeHtml(p.data.relationLabel||EDGE_LABEL[p.data.relationType]||'')}`;
  }},
  series: [{
    type:'graph', layout:'force', data:nodes, links:edges, roam:true,
    emphasis:{focus:'adjacency', lineStyle:{width:3}, label:{fontSize:14}},

  const ms = DATA.nodes.filter(n => [n.name,n.name_en,n.affiliation,n.research].some(v=>(v||'').toLowerCase().includes(q))).slice(0,12);
  if(!ms.length){sug.style.display='none';return;}
  ms.forEach(n => {
    const d = document.createElement('div');
    d.className='item';
    d.innerHTML = `${escapeHtml(n.name)}<span class="en">${escapeHtml(n.name_en||'')}</span>`;
    d.onclick = () => { locate(n); sug.style.display='none'; input.value=n.name; };
    sug.appendChild(d);
  });
  sug.style.display='block';
});

  if(e.key==='Enter'){
    const q = input.value.trim().toLowerCase();
    const m = DATA.nodes.find(n => n.name.toLowerCase()===q || (n.name_en||'').toLowerCase()===q);

});

function locate(node){
  const i = nodeIdx[node.id];
  chart.dispatchAction({type:'focusNodeAdjacency', seriesIndex:0, dataIndex:i});
  showDetail(node);
}

    btn.classList.toggle('active');
    const active = Array.from(document.querySelectorAll('.filter-chip.active')).map(b=>b.dataset.kind);
    const mapped = nodes.map(n => ({...n, itemStyle: {...n.itemStyle, opacity: active.includes(n.tier) ? 1 : 0.08}}));
    const visible = new Set(mapped.filter(n=>active.includes(n.tier)).map(n=>n.id));
    const mappedEdges = edges.map(e => ({...e, lineStyle:{...e.lineStyle, opacity:visible.has(e.source)&&visible.has(e.target)?((EDGE_STYLE[e.relationType]&&EDGE_STYLE[e.relationType].opacity)||.6):.035}}));
    chart.setOption({series: [{data: mapped, links:mappedEdges}]});
  });
});

function relationList(items){
  return `<ul class="person-list">${items.map(({person,edge})=>{
    const note=edge.label?`<span class="relation-note">${escapeHtml(edge.label)}</span>`:'';
    const source=isHttp(edge.source)?`<a class="relation-source" href="${escapeHtml(edge.source)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">来源↗</a>`:'';
    return `<li onclick="showDetailById('${escapeHtml(person.id)}')">${escapeHtml(person.name)}${note}${source}</li>`;
  }).join('')}</ul>`;
}

function sourceList(sources){
  const items=(sources||[]).map((source,i)=>{
    const obj=typeof source==='string'?{label:source,url:isHttp(source)?source:''}:source;
    const label=escapeHtml((obj&&obj.label)||`来源 ${i+1}`);
    return obj&&obj.url&&isHttp(obj.url)?`<li><a href="${escapeHtml(obj.url)}" target="_blank" rel="noopener">${label} ↗</a></li>`:`<li>${label}</li>`;
  }).join('');
  return items?`<ul class="source-list">${items}</ul>`:'';
}

// Detail panel
function showDetail(node){
  const panel = document.getElementById('detailPanel');
  const c = document.getElementById('detailContent');
  panel.classList.add('show');

  const incoming = types => DATA.edges.filter(e=>e.to===node.id&&types.includes(e.type)).map(edge=>({person:nodeById(edge.from),edge})).filter(x=>x.person);
  const outgoing = types => DATA.edges.filter(e=>e.from===node.id&&types.includes(e.type)).map(edge=>({person:nodeById(edge.to),edge})).filter(x=>x.person);
  const context = DATA.edges.filter(e=>(e.from===node.id||e.to===node.id)&&['collab','influence'].includes(e.type)).map(edge=>({person:nodeById(edge.from===node.id?edge.to:edge.from),edge})).filter(x=>x.person);
  const adv=incoming(['phd']), post=incoming(['postdoc']), mentor=incoming(['mentor']);
  const stu=outgoing(['phd']), pd=outgoing(['postdoc']), mentored=outgoing(['mentor']);

  const badgeClass=node.tier==='emerging'?'status-badge':'status-badge context';
  let h = `<h2>${escapeHtml(node.name)} <span class="${badgeClass}">${escapeHtml(TIER_LABEL[node.tier]||'')}</span></h2><div class="en-sub">${escapeHtml(node.name_en||'')}</div>`;
  if(node.affiliation) h += `<div class="info-section"><div class="info-label">机构 / 历史定位</div><div class="info-value">${escapeHtml(node.affiliation)}</div></div>`;
  if(node.titles&&node.titles.length) h += `<div class="info-section"><div class="info-label">代表性身份与荣誉</div><div class="info-value">${node.titles.map(escapeHtml).join(' · ')}</div></div>`;
  if(node.phd) h += `<div class="info-section"><div class="info-label">博士</div><div class="info-value">${escapeHtml(node.phd)}</div></div>`;
  if(node.postdoc) h += `<div class="info-section"><div class="info-label">博后 / 阶段经历</div><div class="info-value">${escapeHtml(node.postdoc)}</div></div>`;
  if(node.research) h += `<div class="info-section"><div class="info-label">研究方向</div><div class="info-value">${escapeHtml(node.research)}</div></div>`;
  if(node.bio) h += `<div class="info-section"><div class="info-label">说明</div><div class="info-value">${escapeHtml(node.bio)}</div></div>`;
  if(adv.length) h += `<div class="info-section"><div class="info-label">博士导师</div>${relationList(adv)}</div>`;
  if(post.length) h += `<div class="info-section"><div class="info-label">博士后指导</div>${relationList(post)}</div>`;
  if(mentor.length) h += `<div class="info-section"><div class="info-label">阶段指导（非博士师承）</div>${relationList(mentor)}</div>`;
  if(stu.length) h += `<div class="info-section"><div class="info-label">博士学生</div>${relationList(stu)}</div>`;
  if(pd.length) h += `<div class="info-section"><div class="info-label">指导的博士后</div>${relationList(pd)}</div>`;
  if(mentored.length) h += `<div class="info-section"><div class="info-label">阶段指导</div>${relationList(mentored)}</div>`;
  if(context.length) h += `<div class="info-section"><div class="info-label">合作 / 学术影响（非师承）</div>${relationList(context)}</div>`;
  if(node.sources&&node.sources.length) h += `<div class="info-section"><div class="info-label">资料来源</div>${sourceList(node.sources)}</div>`;
  c.innerHTML = h;
  panel.scrollTop=0;
}
window.showDetailById = (id) => { const n = DATA.nodes.find(x=>x.id===id); if(n) showDetail(n); };

// Fit whole graph into view
function fitView(){
  try{
    const sm = chart.getModel().getSeriesByIndex(0);
    const ls = sm.getData()._itemLayouts;
    if(!ls||!ls.length) return;
    let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
    ls.forEach(pt=>{ if(!pt)return; if(pt[0]<minX)minX=pt[0]; if(pt[0]>maxX)maxX=pt[0]; if(pt[1]<minY)minY=pt[1]; if(pt[1]>maxY)maxY=pt[1]; });
    const dom = chart.getDom();
    const bw=(maxX-minX)+200, bh=(maxY-minY)+200;
    const zoom = Math.max(0.12, Math.min(1, 0.95*Math.min(dom.clientWidth/bw, dom.clientHeight/bh)));
    chart.setOption({series:[{zoom:zoom, center:[(minX+maxX)/2,(minY+maxY)/2]}]});
  }catch(e){}
}
let _fitted = false;
chart.on('finished', ()=>{ if(!_fitted){ _fitted=true; fitView(); } });
[2000,4000,6000,8000].forEach(t => setTimeout(fitView, t));
